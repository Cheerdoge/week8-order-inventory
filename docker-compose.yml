services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd
    restart: unless-stopped
    ports:
      - "2379:2379"
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd_data:/etcd-data

  item-repository:
    build:
      context: ./item-repository
    image: item-repository:latest
    container_name: item-repository
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      etcd:
        condition: service_started
    ports:
      - "8081:8081"
      - "50051:50051"
    environment:
      GIN_MODE: release
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: ItemRepositoryDB
      KAFKA_BROKER: kafka:9092
      ETCD_ENDPOINTS: etcd:2379
      SERVICE_PORT: 8081
      GRPC_PORT: 50051
      POD_IP: item-repository

  order-createservice:
    build:
      context: ./order-createservice
    image: order-create-service:latest
    container_name: order-createservice
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      etcd:
        condition: service_started
      item-repository:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      GIN_MODE: release
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: order_service_db
      KAFKA_BROKER: kafka:9092
      ETCD_ENDPOINTS: etcd:2379
      SERVICE_PORT: 8080
      POD_IP: order-createservice

volumes:
  mysql_data:
  etcd_data:
